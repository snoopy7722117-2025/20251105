# Spring Boot Application Configuration
# This replaces web.xml and other XML configuration files from Struts 1.0

# Application Name
spring.application.name=Struts to Spring Boot Migration

# Server Configuration
server.port=8080

# Thymeleaf Configuration (replaces JSP)
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# H2 Database Configuration (In-memory database for demo)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development/testing)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.root=INFO
logging.level.com.example.springbootapp=DEBUG
logging.level.org.springframework.web=DEBUG
