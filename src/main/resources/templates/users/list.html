<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <header>
            <h1>User Management</h1>
            <nav>
                <a th:href="@{/}">Home</a> | 
                <a th:href="@{/users}">Users</a>
            </nav>
        </header>

        <main>
            <div class="message" th:if="${message}" th:text="${message}"></div>

            <div class="actions">
                <a th:href="@{/users/new}" class="button">Create New User</a>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="5" style="text-align: center;">No users found. Create a new user to get started.</td>
                        </tr>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}">1</td>
                            <td th:text="${user.username}">johndoe</td>
                            <td th:text="${user.name}">John Doe</td>
                            <td th:text="${user.email}">john@example.com</td>
                            <td>
                                <a th:href="@{/users/{id}/edit(id=${user.id})}" class="button-small">Edit</a>
                                <a th:href="@{/users/{id}/delete(id=${user.id})}" 
                                   class="button-small button-danger"
                                   onclick="return confirm('Are you sure you want to delete this user?')">Delete</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <footer>
            <p>Spring Boot User Management System</p>
        </footer>
    </div>
</body>
</html>
